spring.application.name=documind-backend
server.port=8080

# H2 file database - zero setup. Swap for Postgres by overriding spring.datasource.*
spring.datasource.url=jdbc:h2:file:./data/documind;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

app.jwt.secret=documind-super-secret-key-change-me-in-production-0123456789
app.jwt.ttl-hours=24
app.upload-dir=uploads
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174,http://localhost:3000

# ai.provider: auto | gemini | offline
# Leave the key blank to run fully offline (extractive answers, still cited).
app.ai.provider=auto
app.ai.api-key=${GEMINI_API_KEY:}
app.ai.model=gemini-2.5-flash
app.ai.timeout-seconds=25

app.rag.chunk-size=800
app.rag.chunk-overlap=120
app.rag.top-k=5
